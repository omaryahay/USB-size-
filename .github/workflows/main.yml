
name: Build USB Storage Guard Advanced

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-manager:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build manager
        run: |
          dotnet publish ./UsbStorageGuardManager.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish

      - name: Upload manager
        uses: actions/upload-artifact@v4
        with:
          name: USB-Storage-Guard-Manager
          path: publish/*.exe
          if-no-files-found: error
