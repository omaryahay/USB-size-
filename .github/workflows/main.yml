name: Build USB Storage Guard

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true

      # ===== الواجهة =====
      - name: Publish Manager
        run: >
          dotnet publish Manager/UsbStorageGuardManager.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o out/Manager

      # ===== الخدمة =====
      - name: Publish Service
        run: >
          dotnet publish Service/UsbStorageGuardService.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o out/Service

      # ===== السائق (غير موقّع — للاختبار فقط) =====
      - name: Install WDK
        run: |
          choco install windowsdriverkit10 --yes --no-progress

      - name: Build Driver
        shell: pwsh
        run: |
          $wdk = "C:\Program Files (x86)\Windows Kits\10\build"
          & msbuild Driver\UsbStorageGuard.vcxproj `
            /p:Configuration=Release /p:Platform=x64 /p:SignMode=Off `
            /p:WindowsTargetPlatformVersion=10.0.22621.0
          Copy-Item Driver\x64\Release\UsbStorageGuard.sys out\Manager\ -Force -ErrorAction SilentlyContinue
          Copy-Item Driver\UsbStorageGuard.inf out\Manager\ -Force -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: USB-Storage-Guard-Win64
          path: out/
