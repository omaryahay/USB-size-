name: Build USB Storage Guard Advanced
# Author: Omar Yahya Silan (عمر يحي سيلان)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

env:
  USG_AUTHOR: "Omar Yahya Silan"

jobs:
  build-manager-service:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true

      - name: Publish Manager
        run: >
          dotnet publish Manager/UsbStorageGuardManager.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o out/Manager

      - name: Publish Service
        run: >
          dotnet publish Service/UsbStorageGuardService.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o out/Service

      - name: Copy driver sources for reference
        run: |
          mkdir out\Driver
          copy Driver\UsbStorageGuard.c   out\Driver\
          copy Driver\UsbStorageGuard.inf out\Driver\

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: USB-Storage-Guard-Win64
          path: out/
